[tool.poetry]
name = "Pr1_bank_operations"
version = "0.1.0"
description = ""
authors = ["TG: @by_danilov"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.2.2"
openpyxl = "^3.1.2"
requests = "^2.31.0"
python-dotenv = "^1.0.1"
poetry-core = "^2.1.3"
dotenv = "^0.9.9"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-mock = "^3.14.0"
flake8 = "^7.2.0"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"
